name: Deploy student works to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - "public/student-works/**"
      - ".github/workflows/deploy-student-works-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-student-works"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload student works
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/student-works

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
