name: verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: programming-course-docs-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Cache npm tool downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/AppData/Local/npm-cache
          key: ${{ runner.os }}-programming-course-docs-verify-tools-${{ hashFiles('.github/workflows/verify.yml', '.markdownlint.json', '.prettierrc', 'scripts/verify.ps1') }}
      - name: Run verification script
        run: powershell -File scripts/verify.ps1
