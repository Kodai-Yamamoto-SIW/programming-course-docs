name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
    group: programming-course-docs-ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
            - name: Cache npm tool downloads
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.npm
                      ~/AppData/Local/npm-cache
                  key: ${{ runner.os }}-programming-course-docs-lint-tools-${{ hashFiles('.github/workflows/ci.yml', 'package-lock.json') }}
            - name: Install dependencies
              run: npm ci
            - name: Run verification checks
              run: npm run verify

    integration:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            COURSE_CONTENT_SOURCE: '../course-content'
            NEXT_PUBLIC_WORKS_BASE_URL: https://metyatech.github.io/programming-course-student-works
        steps:
            - name: Checkout course content
              uses: actions/checkout@v6
              with:
                  path: course-content

            - name: Checkout course-docs-site
              uses: actions/checkout@v6
              with:
                  repository: metyatech/course-docs-site
                  ref: main
                  path: site

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'
                  cache-dependency-path: site/package-lock.json

            - name: Install dependencies
              working-directory: site
              run: npm ci

            - name: Lint site against local content
              working-directory: site
              run: npm run lint

            - name: Build site against local content
              working-directory: site
              run: npm run build:verified
