<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化粧品サイト</title>
    <link rel="stylesheet" href="style.css">
    <script src="./index.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&display=swap" rel="stylesheet">
</head>

<body>
    <div class="mein-header">
        <header>
            <button class="ham-btn">
                <span class="ham-icon">
                    <span class="line top"></span>
                    <span class="line middle"></span>
                    <span class="line buttom"></span>
                </span>
            </button>
            <div class="mein-visual">
                <div class="mein-1">
                <h1>素肌が語りだす、<br>美しさの物語。</h1>
                <a href="#lineup" class="btn">Lineup</a>
                </div>
                <img class="mein-gazou" src="./imeges/mein_gazou.png" alt="">
            </div>
        </header>
        <nav class="drawer">
            <ul>
                <li><a href="#">Top</a></li>
                <li><a href="#">Lineup</a></li>
                <li><a href="#">Topic</a></li>
            </ul>
        </nav>
        <div class="overlay"></div>
    </div>
    <section class="about">
        <p>私たちは“肌が喜ぶケア”を追求し、こだわり抜いた
            <br>成分と処方で、
            <br>あなたの素肌に寄り添います。</p>
    </section>
    <section class="lineup">
        <h2>Lineup</h2>
        <div class="lineup">
            <div class="item">
                <img src="./imeges/Group 1.png" alt="美容液の画像">
                <a href="#" class="detail">詳細はこちら</a>
            </div>
            <div class="item right">
                <img src="./imeges/Group 2.png" alt="美容液の画像">
                <a href="#" class="detail">詳細はこちら</a>
            </div>
            <div class="item">
                <img src="./imeges/Group 3.png" alt="美容液の画像">
                <a href="#" class="detail">詳細はこちら</a>
            </div>
        </div>
    </section> 
</body>

</html>
